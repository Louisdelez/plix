[package]
name = "plix-mod-distribution"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Mod distribution system for plix - registry, dependencies, versioning, and optional signatures"

[dependencies]
# Core
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

# Async/IO
tokio = { workspace = true, features = ["fs", "io-util"] }
reqwest = { workspace = true }

# Version parsing
semver = "1.0"

# Archive handling
zip = "2.2"

# Hashing
sha2 = "0.10"

# Async trait for registry source
async-trait = "0.1"

# Paths
dirs-next = { workspace = true }

# Internal crates
plix-mod-core = { workspace = true }

# NOTE: Signature verification is feature-gated due to dependency compatibility.
# The ed25519-dalek 2.x line has transitive dependencies requiring Rust edition 2024.
# For now, we use version 1.x which is compatible with Rust 1.83 stable.
[dependencies.ed25519-dalek]
version = "1.0"
optional = true

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
rand = { workspace = true }

[features]
default = []
signatures = ["dep:ed25519-dalek"]
