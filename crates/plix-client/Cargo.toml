[package]
name = "plix-client"
description = "Game client for Plix with prediction and rendering"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "plix-client"
path = "src/main.rs"

[features]
default = []
# Optional CEF-based UI shell for HTML/CSS/JS rendering (Feature 030)
# When enabled, allows rendering web-based UI as GPU texture
# Falls back to native UI (Feature 005) when disabled or unavailable
cef-ui = []

[build-dependencies]
shadow-rs = { workspace = true }

[dependencies]
plix-common = { workspace = true }
plix-net = { workspace = true }
plix-arena = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
winit = { workspace = true }
wgpu = { workspace = true }
bytemuck = { workspace = true }
pollster = { workspace = true }
glam = { workspace = true }
clap = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
dirs = "5.0"
bincode = { workspace = true }
reqwest = { workspace = true }
rand = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
