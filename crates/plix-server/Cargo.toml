[package]
name = "plix-server"
description = "Authoritative game server for Plix"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "plix-server"
path = "src/main.rs"

[[bin]]
name = "plix-perf"
path = "src/bin/plix-perf.rs"
required-features = ["perf"]

[[bin]]
name = "plix-server-headless"
path = "src/bin/plix-server-headless.rs"

[features]
default = []
perf = ["dep:serde_json", "dep:chrono"]

[build-dependencies]
shadow-rs = { workspace = true }

[dependencies]
plix-common = { workspace = true }
plix-net = { workspace = true }
plix-arena = { workspace = true }
plix-mod-core = { workspace = true }
plix-mod-runtime-wasm = { workspace = true }
plix-mod-distribution = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
clap = { workspace = true }
thiserror = { workspace = true }
bincode = { workspace = true }
dirs-next = { workspace = true }
glam = { workspace = true }
serde = { workspace = true }
toml = { workspace = true }
once_cell = { workspace = true }
reqwest = { workspace = true }
# Optional dependencies for perf feature
serde_json = { workspace = true, optional = true }
chrono = { workspace = true, optional = true }

[dev-dependencies]
rand = { workspace = true }
tempfile = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
