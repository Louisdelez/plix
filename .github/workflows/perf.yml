# Performance profiling workflow
# Runs the plix-perf harness and uploads results as artifacts

name: Performance Profiling

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      scenario:
        description: 'Scenario to run (idle, world_churn, net_stress, or all)'
        required: false
        default: 'all'
      duration:
        description: 'Duration in seconds'
        required: false
        default: '60'

env:
  CARGO_TERM_COLOR: always

jobs:
  perf:
    name: Performance Harness
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-action@stable
        with:
          components: clippy

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: perf-harness

      - name: Build perf harness (release)
        run: cargo build --release --bin plix-perf --features perf

      - name: Run Idle scenario
        if: github.event.inputs.scenario == '' || github.event.inputs.scenario == 'all' || github.event.inputs.scenario == 'idle'
        run: |
          cargo run --release --bin plix-perf --features perf -- \
            --scenario idle \
            --duration ${{ github.event.inputs.duration || '60' }} \
            --output perf_report_idle.json

      - name: Run World Churn scenario
        if: github.event.inputs.scenario == '' || github.event.inputs.scenario == 'all' || github.event.inputs.scenario == 'world_churn'
        run: |
          cargo run --release --bin plix-perf --features perf -- \
            --scenario world_churn \
            --duration ${{ github.event.inputs.duration || '60' }} \
            --output perf_report_world_churn.json

      - name: Run Net Stress scenario
        if: github.event.inputs.scenario == '' || github.event.inputs.scenario == 'all' || github.event.inputs.scenario == 'net_stress'
        run: |
          cargo run --release --bin plix-perf --features perf -- \
            --scenario net_stress \
            --duration ${{ github.event.inputs.duration || '60' }} \
            --output perf_report_net_stress.json

      - name: Upload performance reports
        uses: actions/upload-artifact@v4
        with:
          name: perf-reports-${{ github.sha }}
          path: perf_report_*.json
          retention-days: 30

      - name: Print summary
        run: |
          echo "## Performance Report Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          for file in perf_report_*.json; do
            if [ -f "$file" ]; then
              scenario=$(jq -r '.metadata.scenario' "$file")
              avg=$(jq -r '.tick_stats.avg_ms' "$file")
              p95=$(jq -r '.tick_stats.p95_ms' "$file")
              p99=$(jq -r '.tick_stats.p99_ms' "$file")
              echo "### $scenario" >> $GITHUB_STEP_SUMMARY
              echo "- Avg: ${avg}ms" >> $GITHUB_STEP_SUMMARY
              echo "- p95: ${p95}ms" >> $GITHUB_STEP_SUMMARY
              echo "- p99: ${p99}ms" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
            fi
          done

  regression-check:
    name: Regression Check
    runs-on: ubuntu-latest
    needs: perf
    if: github.event_name == 'pull_request'

    steps:
      - name: Download current reports
        uses: actions/download-artifact@v4
        with:
          name: perf-reports-${{ github.sha }}
          path: current

      - name: Check p95 threshold
        run: |
          # Check if p95 exceeds threshold (15ms for now)
          for file in current/perf_report_*.json; do
            if [ -f "$file" ]; then
              scenario=$(jq -r '.metadata.scenario' "$file")
              p95=$(jq -r '.tick_stats.p95_ms' "$file")

              # Compare with threshold (using bc for floating point)
              if (( $(echo "$p95 > 15.0" | bc -l) )); then
                echo "::warning::$scenario p95 ($p95 ms) exceeds threshold (15ms)"
              else
                echo "::notice::$scenario p95 ($p95 ms) OK"
              fi
            fi
          done
