<?xml version="1.0" encoding="UTF-8"?>
<!--
  Colorblind Simulation Filters - Feature 042

  These SVG filters simulate different types of colorblindness
  using feColorMatrix transformations based on research values.

  Usage in CSS: filter: url('colorblind-filters.svg#protanopia');
-->
<svg xmlns="http://www.w3.org/2000/svg" version="1.1">
  <defs>
    <!--
      Protanopia (Red-blind)
      Affects ~1% of males
      Red cones are missing or non-functional
    -->
    <filter id="protanopia">
      <feColorMatrix type="matrix" values="
        0.567, 0.433, 0,     0, 0
        0.558, 0.442, 0,     0, 0
        0,     0.242, 0.758, 0, 0
        0,     0,     0,     1, 0
      "/>
    </filter>

    <!--
      Deuteranopia (Green-blind)
      Affects ~6% of males (most common)
      Green cones are missing or non-functional
    -->
    <filter id="deuteranopia">
      <feColorMatrix type="matrix" values="
        0.625, 0.375, 0,   0, 0
        0.7,   0.3,   0,   0, 0
        0,     0.3,   0.7, 0, 0
        0,     0,     0,   1, 0
      "/>
    </filter>

    <!--
      Tritanopia (Blue-blind)
      Affects <1% of population
      Blue cones are missing or non-functional
    -->
    <filter id="tritanopia">
      <feColorMatrix type="matrix" values="
        0.95, 0.05,  0,     0, 0
        0,    0.433, 0.567, 0, 0
        0,    0.475, 0.525, 0, 0
        0,    0,     0,     1, 0
      "/>
    </filter>
  </defs>
</svg>
