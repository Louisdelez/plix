# Test Arena - Default arena for Plix MVP
# A simple rectangular arena with spawn points at opposite corners

[metadata]
name = "Test Arena"
version = "0.1.0"
size = [64, 32, 64]
game_mode = "tdm"

# Team 0 spawn points (near origin corner)
[[spawn_points]]
team = 0
position = [10.0, 1.0, 10.0]
rotation = 45.0

[[spawn_points]]
team = 0
position = [10.0, 1.0, 14.0]
rotation = 45.0

[[spawn_points]]
team = 0
position = [14.0, 1.0, 10.0]
rotation = 45.0

[[spawn_points]]
team = 0
position = [14.0, 1.0, 14.0]
rotation = 45.0

# Team 1 spawn points (far corner)
[[spawn_points]]
team = 1
position = [50.0, 1.0, 50.0]
rotation = 225.0

[[spawn_points]]
team = 1
position = [50.0, 1.0, 54.0]
rotation = 225.0

[[spawn_points]]
team = 1
position = [54.0, 1.0, 50.0]
rotation = 225.0

[[spawn_points]]
team = 1
position = [54.0, 1.0, 54.0]
rotation = 225.0

[blocks]
# Stone floor at y=0
floor = { y = 0, block = "stone" }

# Brick walls around the border, 8 blocks high
walls = { border = true, height = 8, block = "brick" }

# Center platform
[[blocks.regions]]
min = [28, 1, 28]
max = [36, 2, 36]
block = "metal"

# Corner pillars
[[blocks.regions]]
min = [4, 1, 4]
max = [7, 6, 7]
block = "brick"

[[blocks.regions]]
min = [57, 1, 4]
max = [60, 6, 7]
block = "brick"

[[blocks.regions]]
min = [4, 1, 57]
max = [7, 6, 60]
block = "brick"

[[blocks.regions]]
min = [57, 1, 57]
max = [60, 6, 60]
block = "brick"
