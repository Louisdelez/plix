[workspace]
resolver = "2"
members = [
    "crates/plix-common",
    "crates/plix-net",
    "crates/plix-server",
    "crates/plix-client",
    "crates/plix-arena",
    "crates/plix-tools",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT OR Apache-2.0"
repository = "https://github.com/your-org/plix"

[workspace.dependencies]
# Shared across crates
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
thiserror = "1.0"

# Math
glam = { version = "0.29", features = ["serde"] }

# Async / IO
tokio = { version = "1.0", features = ["net", "rt-multi-thread", "macros", "time", "sync", "signal"] }

# Windowing / Input (client)
winit = "0.30"
wgpu = "23.0"
bytemuck = { version = "1.19", features = ["derive"] }
pollster = "0.4"

# Arena loading
toml = "0.8"

# CLI
clap = { version = "4.0", features = ["derive"] }

# Testing
rand = "0.8"
tempfile = "3.14"

# Internal crates
plix-common = { path = "crates/plix-common" }
plix-net = { path = "crates/plix-net" }
plix-server = { path = "crates/plix-server" }
plix-client = { path = "crates/plix-client" }
plix-arena = { path = "crates/plix-arena" }
plix-tools = { path = "crates/plix-tools" }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
